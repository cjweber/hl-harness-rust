[package]
name = "hl-harness"
version = "0.1.0"
edition = "2021"
description = "Rust port of the hl-harness coding-agent harness"

[lib]
name = "hl_harness"
path = "src/lib.rs"

[[bin]]
name = "hl-harness"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "process", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"
anyhow = "1"
regex = "1"
url = "2"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
